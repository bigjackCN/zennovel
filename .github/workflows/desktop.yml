name: Desktop app

# Builds the ZenNovel desktop installers. Run it by hand (Actions → Desktop
# app → Run workflow) or push a tag like desktop-v0.1.0 to also publish a
# GitHub release with the installers attached.
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm test
      - name: Build installer
        run: pnpm --filter @zennovel/desktop dist
        env:
          # Unsigned builds for now: no Apple / Windows certificates configured.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: zennovel-${{ runner.os }}
          path: |
            packages/desktop/release/*.exe
            packages/desktop/release/*.dmg
            packages/desktop/release/*.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # The website links to releases/latest/download/ZenNovel-<os>-<arch>.<ext>.
          make_latest: true
