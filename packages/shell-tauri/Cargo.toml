[package]
name = "zennovel-player"
version = "0.1.0"
description = "Plays a ZenNovel game folder (game/ next to the executable) in the system web view"
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
