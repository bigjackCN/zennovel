<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Play a ZenNovel sample story" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>ZenNovel</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      .play-message {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px;
        color: #ddd;
        font:
          16px system-ui,
          sans-serif;
        text-align: center;
      }
      .play-message a {
        color: #9cc4ff;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/play.ts"></script>
  </body>
</html>
